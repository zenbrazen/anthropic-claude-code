name: Fetch Papers

on:
  schedule:
    - cron: '0 7 * * *'   # 7:00 AM UTC (dawn)
    - cron: '0 19 * * *'  # 7:00 PM UTC (dusk)
  workflow_dispatch:       # allow manual runs from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and summarize papers
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run fetch

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/papers.json public/index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: add papers $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
